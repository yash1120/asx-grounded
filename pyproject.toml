[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asx-grounded"
version = "0.1.0"
description = "Grounded Q&A agent over ASX continuous-disclosure announcements with a public eval scoreboard"
authors = [{ name = "Yash Goyal" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.2.0",
    "rank-bm25>=0.2.2",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
]

[project.scripts]
asx-ingest = "asx_grounded.ingestion.fetch_asx:cli"
asx-embed = "asx_grounded.ingestion.embed:cli"
asx-eval = "asx_grounded.eval.run_eval:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/asx_grounded"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
