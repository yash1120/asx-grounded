app = "asx-grounded"
primary_region = "syd"

[build]

[env]
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

# Set these with `fly secrets set ...`:
#   ANTHROPIC_API_KEY
#   QDRANT_URL
#   QDRANT_API_KEY
#   DATABASE_URL
